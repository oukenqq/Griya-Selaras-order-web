<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA primary configuration and metadata -->
    <title>Griya Selaras Order</title>
    <meta name="description" content="Aplikasi pencatatan pesanan dan keuangan sederhana untuk UMKM jahit Griya Selaras by Syuhada." />
    
    <!-- Mobile devices status bar & behavior customization -->
    <meta name="theme-color" content="#3A2E2A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Griya Order" />
    
    <!-- Icons and Manifest reference -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/sw.js")
          .then(function () {
            console.log("Service Worker registered");
          })
          .catch(function (error) {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
